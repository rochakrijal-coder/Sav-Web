name: Deploy website to Linode

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linode-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.LINODE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          persist-credentials: false

      - name: Configure verified SSH connection
        env:
          DEPLOY_KEY: ${{ secrets.LINODE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LINODE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/linode_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/linode_deploy ~/.ssh/known_hosts

      - name: Upload website files
        run: |
          set -euo pipefail
          test -s index.html
          test -s style.css
          rsync -rt --chmod=D755,F644 \
            -e "ssh -i $HOME/.ssh/linode_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
            index.html style.css moon-scene.js assets sheet_aug_10.mp4 \
            deploy@172.236.123.73:/var/www/html/

      - name: Verify live HTML matches this commit
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            --resolve savitara.org:443:172.236.123.73 \
            "https://savitara.org/?deploy=$GITHUB_SHA" -o /tmp/live-index.html
          cmp index.html /tmp/live-index.html

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/linode_deploy
